{% extends 'base.html' %}

{% block title %}Event List{% endblock %}

{% block content %}
 <h2>Event List</h2>

 <ul>
    {% for event in events %} 
     <li>
        <a href="{% url 'event_details' event.id %}">{{ event.title }}</a> - {{ event.start_time }}
     </li>
    {% empty %}
     <li>No events available.</li>
    {% endfor %}
 </ul>
  

  
{% endblock %}
