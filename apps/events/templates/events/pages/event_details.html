{% extends 'base.html' %}

{% block title %}Event Details{% endblock %}

{% block content %}

  <div class="event-details">
    <h1>{{ event.title }}</h1>
    <p>About: {{ event.description }}</p>
    <p><strong>Date:</strong> {{ event.start_time|date:"d/m/Y" }}</p>
    <p><strong>Location:</strong> {{ event.location }}</p>


  
{% endblock %}
