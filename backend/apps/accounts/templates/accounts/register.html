{% extends 'base.html' %}

{% block title %}
  Register
{% endblock %}

{% block content %}
  <h2>Register</h2>

    {% if form.errors %}
        <div class="alert alert-danger">
           Error with your form
        </div>
    {% endif %}

  <form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">Register</button>
  </form>
{% endblock %}
