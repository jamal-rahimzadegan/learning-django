{% extends 'base.html' %}

{% block title %}Home | My Django App{% endblock %}

{% block content %}
 <h2>Create New Event</h2>
    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li style="color: green;">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }} 
        <button type="submit">Save to Database</button>
    </form>
{% endblock %}
