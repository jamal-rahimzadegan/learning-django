<!DOCTYPE html>
<html>
<head>
    <title>Create New Event</title>
</head>
<body>
    <h2>Add New Record</h2>
    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li style="color: green;">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }} 
        <button type="submit">Save to Database</button>
    </form>
    
</body>
</html>
